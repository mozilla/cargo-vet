[package]
name = "cargo-vet"
version = "0.10.2"
edition = "2021"
authors = ["Bobby Holley <bobbyholley@gmail.com>"]
license = "Apache-2.0/MIT"
repository = "https://github.com/mozilla/cargo-vet"
homepage = "https://mozilla.github.io/cargo-vet/"
description = "Supply-chain security for Rust"
rust-version = "1.90"
exclude = [
  "book/*",
  "src/snapshots/*",
  "src/tests/",
  "tests/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64-stream = "6.0.0"
bytes = "1.12.1"
cargo_metadata = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std", "serde"] }
clap = { version = "4.5.61", features = ["derive"] }
clap-cargo = "0.18.3"
console = "0.16.4"
crates-index = { version = "3.14.0", default-features = false }
dirs = "6.0.0"
filetime = "0.2.29"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
home = "0.5.11"
indicatif = "0.18.4"
lazy_static = "1.5.0"
libc = "0.2"
nom = "7.1.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
similar = "3.1.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
textwrap = { version = "0.16.2", default-features = false }
toml_edit = { version = "0.25.5", features = ["serde"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = "0.3.23"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.19"
url = "2.5.8"
toml = "1.0.7"
open = "5.4.0"
cargo-config2 = "0.1.43"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
]

[dev-dependencies]
insta = "1.48.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.5"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"

[workspace]
exclude = ["tests/test-project"]
